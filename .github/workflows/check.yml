# Runs the flake's checks (tests/) on every push and PR.
#   eval:     every host evaluates, its invariants hold, every file is nixfmt-formatted.
#   mac-mini: builds the whole mac-mini system on an Apple Silicon runner.
# yoga isn't built: its closure (Hyprland, NVIDIA, ...) is too big for CI.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # --all-systems so the darwin checks are evaluated on Linux too.
      - run: nix flake check --no-build --all-systems
      # The one cheap check that needs a build: nixfmt over every file.
      - run: nix build --print-build-logs .#checks.x86_64-linux.formatting

  mac-mini:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs .#checks.aarch64-darwin.mac-mini-build
